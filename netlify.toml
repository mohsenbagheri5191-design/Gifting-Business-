# Netlify builds this Next.js app with its Next.js runtime (added automatically).
# Database: the @netlify/database dependency provisions Netlify Database (Postgres), and the SQL
# files in netlify/database/migrations are applied before each deploy goes live.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
